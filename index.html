<head>
    <meta charset="UTF-8">

    <meta property="og:url" content="https://slip-kk.fr" />

    <meta name="robots" content="index, nofollow">

    <!-- Metadata Google -->
    <meta name="description" content="Vous ne détestez pas le lundi, vous détestez la domination au travail.">
    <title>SLIP KK</title>
    <style>
        body {
            background-image: url("./assets/slip-jaune-120x120.jpg");
            background-repeat: repeat;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f4f4f4;
        }

        canvas {
            border: 1px solid black;
            background-color: antiquewhite;
        }

        #instructions-snake,
        #content {
            text-align: center;
            margin-bottom: 20px;
            font-weight: bold;
            background-color: #f1cd00;
            font-family: 'Courier New', Courier, monospace;
        }

        #instructions-snake p,
        #content {
            padding: 10px 10px;
            margin: 10px 10px;
        }

        #swal2-title {
            margin-bottom: 30px;
        }

        #quote {
            margin-bottom: 10px;
        }

        #opus {
            text-align: right;
            font-weight: bold;
            margin-top: 10px;
            margin-bottom: 2px;
        }

        #author {
            text-align: right;
            font-style: italic;
            margin-top: 2px;
        }

        @media only screen and (max-width: 799px) {

            #gameCanvas,
            #instructions-snake {
                display: none;
            }

            #content {
                text-align: left;
                width: 70%;
            }
        }
    </style>
</head>

<body>
    <div>
        <img src="./assets/SLIP.gif" alt="SLIP KK" width="400">
    </div>
    <div id="instructions-snake">
        <p>Ceci est un jeu de Snake.</p>
        <p>Si j'étais vous j'utiliserais les flèches directionnelles AVANT de manger le mur.</p>
        <p>Récompense situationniste.</p>
    </div>
    <div id="content">
        <canvas id="gameCanvas" width="400" height="400"></canvas>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>

    </script>
    <script>
        async function loadJSON() {
            try {
                // Use fetch to load the local JSON file
                const response = await fetch('quotes.json');
                // Check if the response is OK
                if (!response.ok) {
                    throw new Error('Failed to load the JSON file');
                }
                // Parse the JSON data
                const res = await response.json();
                return res
            } catch (error) {
                // Handle errors
                console.error('Error loading JSON:', error);
            }
        }

        // Call the function to load the JSON
        async function init() {
            const quotes = await loadJSON();
            console.log("quotes", quotes)
            const isMobile = window.matchMedia("(max-width: 799px)").matches;  // Check if device is mobile

            if (isMobile) {
                const quoteContainer = document.getElementById("content");
                const div = quoteContainer.appendChild(document.createElement("div"))
                const random = Math.floor(Math.random() * quotes.length)
                console.log(random)
                const quote = quotes[Math.floor(Math.random() * quotes.length)]

                const titleElement = document.createElement("h1")
                titleElement.textContent = "Vous ne détestez pas le lundi, vous détestez la domination au travail."

                const quoteElement = document.createElement("p");
                quoteElement.id = "quote";
                quoteElement.textContent = `${quote.quote}`;

                const opusElement = document.createElement("p");
                opusElement.id = "opus";
                opusElement.textContent = quote.opus;

                const authorElement = document.createElement("p");
                authorElement.id = "author";
                authorElement.textContent = `${quote.author}, ${quote.year}`;


                div.appendChild(titleElement)
                div.appendChild(quoteElement);
                div.appendChild(opusElement);
                div.appendChild(authorElement);
            } else {

                const canvas = document.getElementById("gameCanvas");
                const ctx = canvas.getContext("2d");
                let snake = [{ x: 200, y: 200 }];
                let food = { x: 300, y: 300 };
                let dx = 20;
                let dy = 0;
                let changingDirection = false;
                let gameInterval;

                function drawSnakePart(snakePart) {
                    ctx.fillStyle = "green";
                    ctx.strokeStyle = "darkgreen";
                    ctx.fillRect(snakePart.x, snakePart.y, 20, 20);
                    ctx.strokeRect(snakePart.x, snakePart.y, 20, 20);
                }

                function drawSnake() {
                    snake.forEach(drawSnakePart);
                }

                function createFood() {
                    food.x = Math.floor(Math.random() * 20) * 20;
                    food.y = Math.floor(Math.random() * 20) * 20;
                }

                function drawFood() {
                    ctx.fillStyle = "red";
                    ctx.fillRect(food.x, food.y, 20, 20);
                }

                function moveSnake() {
                    const head = { x: snake[0].x + dx, y: snake[0].y + dy };
                    snake.unshift(head);

                    if (head.x === food.x && head.y === food.y) {
                        createFood();
                    } else {
                        snake.pop();
                    }
                }

                function changeDirection(direction) {
                    if (changingDirection) return;
                    changingDirection = true;
                    const goingUp = dy === -20;
                    const goingDown = dy === 20;
                    const goingRight = dx === 20;
                    const goingLeft = dx === -20;

                    if (direction === "left" && !goingRight) {
                        dx = -20;
                        dy = 0;
                    }
                    if (direction === "up" && !goingDown) {
                        dx = 0;
                        dy = -20;
                    }
                    if (direction === "right" && !goingLeft) {
                        dx = 20;
                        dy = 0;
                    }
                    if (direction === "down" && !goingUp) {
                        dx = 0;
                        dy = 20;
                    }
                }

                function handleTouchStart(event) {
                    const touch = event.touches[0];
                    this.touchStartX = touch.clientX;
                    this.touchStartY = touch.clientY;
                }

                function handleTouchMove(event) {
                    if (!this.touchStartX || !this.touchStartY) return;

                    const touch = event.touches[0];
                    const dx = touch.clientX - this.touchStartX;
                    const dy = touch.clientY - this.touchStartY;

                    if (Math.abs(dx) > Math.abs(dy)) {
                        if (dx > 0) {
                            changeDirection("right");
                        } else {
                            changeDirection("left");
                        }
                    } else {
                        if (dy > 0) {
                            changeDirection("down");
                        } else {
                            changeDirection("up");
                        }
                    }

                    this.touchStartX = null;
                    this.touchStartY = null;
                }

                function checkCollision() {
                    for (let i = 4; i < snake.length; i++) {
                        const hasCollided = snake[i].x === snake[0].x && snake[i].y === snake[0].y;
                        if (hasCollided) return true;
                    }

                    const hitLeftWall = snake[0].x < 0;
                    const hitRightWall = snake[0].x > canvas.width - 20;
                    const hitTopWall = snake[0].y < 0;
                    const hitBottomWall = snake[0].y > canvas.height - 20;

                    return hitLeftWall || hitRightWall || hitTopWall || hitBottomWall;
                }

                function gameLoop() {
                    if (checkCollision()) {
                        clearInterval(gameInterval);
                        const quote = quotes[snake.length % quotes.length];
                        Swal.fire({
                            title: `<p id="quote">Vous ne détestez pas le lundi, vous détestez la domination au travail.</p>
                           <p id="author">Nicolas Framont, 2024</p>`,
                            html: `
                                   <p id="quote">"${quote.quote}"</p>
                                   <p id="opus">${quote.opus}</p>
                                   <p id="author">${quote.author}, ${quote.year}</p>
                                `,
                            icon: "question",
                            iconColor: "yellow",
                            background: "black",
                            showCancelButton: true,
                            confirmButtonText: "Situez-moi encore",
                            cancelButtonText: "Auto-dissolution de l'expérience situationniste",
                            footer: `Vous avez fait un score de ${snake.length - 1}, ce qui est bien mais pas top.`,
                        }).then((result) => {
                            if (result.isConfirmed) {
                                resetGame();
                            }
                        });
                        return;
                    }

                    changingDirection = false;
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    drawFood();
                    moveSnake();
                    drawSnake();
                }

                function resetGame() {
                    snake = [{ x: 200, y: 200 }];
                    dx = 20;
                    dy = 0;
                    changingDirection = false;
                    createFood();
                    gameInterval = setInterval(gameLoop, 100);
                }

                canvas.addEventListener("touchstart", handleTouchStart, false);
                canvas.addEventListener("touchmove", handleTouchMove, false);
                document.addEventListener("keydown", (event) => {
                    const directions = {
                        37: "left",
                        38: "up",
                        39: "right",
                        40: "down"
                    };
                    changeDirection(directions[event.keyCode]);
                });
                resetGame();
            }
        }

        init();
    </script>
</body>
